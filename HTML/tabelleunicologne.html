<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsere Tabelle</title>
</head>

<body>

    <!--division-->
    <div align="center">
        <table border="1">

            <!--Table row -> Tabellenzeile-->
            <tr>
                <!--table header-->
                <th>Artikelnummer</th>
                <th>Produktname</th>
                <th>Preis in EUR</th>
            </tr>

            <tr>
                <!--table digit-->
                <td>0001</td>
                <td>HTML-Buch</td>
                <td>19,99€</td>
            </tr>

            <tr>
                <td>0002</td>
                <td>CSS-Buch</td>
                <td rowspan="2" bgcolor="green"><u>15,99€</u></td>
            </tr>

            <tr>
                <td>0003</td>
                <td>JavaScript-Buch</td>
                <!--<td> </td>-->
            </tr>
        </table>
    </div>

</body>

</html>
