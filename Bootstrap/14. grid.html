<!--Bootstrap Grid Practice

Please recreate the layout pictured below: a Bootstrap grid with two rows: the first row should have columns taking up one third and two thirds of the row, 
and the second row should have columns taking up one quarter, one half, and one quarter of the row. 
I've included Bootstrap for you, but you'll need to create all the relevant markup (container, row, column, etc.). I'm not testing your code for the specific colors, 
but I recommend giving the columns background colors so that you can differentiate them.  I'm also not testing for the specific text in each column. 

Please note: Although Bootstrap will allow you to use col without a column size to automatically fill the remaining space in the row (and that would normally 
be an acceptable solution), the tests for this exercise will not recognize that as a correct solution. 
So, please be sure to explicitly include the column size for each individual col-* class.-->

<!DOCTYPE html>
<html>

<head>
    <title>Bootstrap Grid Exercise</title>
    <!--INCLUDING BOOTSTRAP-->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">

</head>

<body>
    <section class="container">
        <div class="row">
            <div class="col-4 bg-primary">I AM 4 UNITS</div>
            <div class="col-8 bg-success">I AM 8 UNITS</div>
        </div>
        <div class="row">
            <div class="col-3 bg-info">I AM 3 UNITS</div>
            <div class="col-6 bg-warning">I AM 6 UNITS</div>
            <div class="col-3 bg-info">I AM 3 UNITS</div>
        </div>
    </section>
