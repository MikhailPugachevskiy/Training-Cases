<!--Let's get some practice with HTML images and anchor elements. In index.html, please do the following:

    Create a link that goes to this URL:
    https://en.wikipedia.org/wiki/Wolf
    You can use whatever descriptive link text you would like.

    Create an image element using this source:
    https://upload.wikimedia.org/wikipedia/commons/5/5f/Kolm%C3%A5rden_Wolf.jpg

    Make sure to include some alt text on the image. The image linked above shows a wolf licking its lips. Your alt text can be worded however you like, but it should describe the image.-->
