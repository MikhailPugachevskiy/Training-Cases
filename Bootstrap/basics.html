<!--Bootstrap is already included! Please add in the appropriate bootstrap classes according to these instructions:

    Make the section a bootstrap container

    Give the h1 white text, a dark background, and center-aligned text

    Make the div an alert ('warning' color).  Set the role attribute to alert, for accessibility purposes!

    Make the first button a green bootstrap button

    Make the second button a red bootstrap button -->

<!DOCTYPE html>
<html>

<head>
    <title>Bootstrap Buttons Exercise</title>
    <!--INCLUDING BOOTSTRAP-->
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGMN5t9UJ0Z" crossorigin="anonymous">

</head>

<body>
    <section class="container">
        <h1 class="display-5 text-center text-white bg-dark">Bad News</h1>

        <div class="alert alert-warning" role="alert">You are going to die one day! It sucks, but it's normal :(
        </div>

        <button type="button" class="btn btn-secondary btn-success">Come To Terms With</button>
        <button type="button" class="btn btn-secondary btn-danger">Continue To Deny</button>

    </section>
</body>

</html>
