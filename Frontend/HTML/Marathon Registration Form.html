<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Form</title>
</head>

<body>
    <h1>Race Registration!</h1>
    <form action="">
        <div>
            <label for="firstName">First Name:</label>
            <input type="text" id="firstName" name="firstName">

            <label for="lastName">Last Name:</label>
            <input type="text" id="lastName" name="lastName">
        </div>

        <p>Select a Race:</p>
        <div>
            <input type="radio" id="5k" name="5k">
            <label for="5k">Fun Run 5k</label>
        </div>

        <div>
            <input type="radio" id="halfMarathon" name="halfMarathon">
            <label for="halfMarathon">Half Marathon</label>
        </div>

        <div>
            <input type="radio" id="fullMarathon" name="fullMarathon">
            <label for="fullMarathon">Full Marathon</label>
        </div>

        <div>
            <label for="email">Email</label>
            <input type="email" id="email" name="email">

            <label for="password">Password</label>
            <input type="password" id="password" name="password">
        </div>

        <div>
            <label for="division">Select Age Group:</label>
            <select id="division" name="division">
                <option value="children">under 18</option>
                <option value="young">18-30</option>
                <option value="adults">30-40</option>
                <option value="seniors">50+</option>
            </select>
        </div>

        <button>Register</button>

    </form>

</body>

</html>
